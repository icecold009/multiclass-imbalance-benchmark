name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-release.txt
      - run: python -m pip install --requirement requirements.txt
      - run: python -m pip install --requirement requirements-release.txt
      - run: >-
          python -m pytest
          --ignore=tests/test_v2_analysis.py
          --ignore=tests/test_v2_execution.py
          --ignore=tests/test_v2_pipeline.py
          --ignore=tests/test_v2_registry.py
          --ignore=tests/test_v2_sharding.py
          --ignore=tests/test_v2_smoke.py
          --ignore=tests/test_v2_tuning.py
      - run: python -m ruff check src tests

  v2-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-v2.txt
            requirements-release.txt
      - run: python -m pip install --requirement requirements-v2.txt
      - run: python -m pip install --requirement requirements-release.txt
      - run: python -m pip install scikit-posthocs==0.14.0 "statsmodels>=0.14,<0.15"
      - run: python -m pip check
      - run: python -m pytest
      - run: python -m ruff check src tests scripts
